<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Was empty, so every page with no head of its own shipped a blank description
		     and search and link previews had nothing to quote. -->
		<meta
			name="description"
			content="The free Kahoot alternative. Host interactive quizzes right from your browser."
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the stored theme before first paint, so dark mode does not flash
			// light on load. Mirrors the logic in src/routes/+layout.svelte.
			try {
				if (
					localStorage.theme === 'dark' ||
					(!('theme' in localStorage) &&
						window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {
				// localStorage can throw when site data is blocked; fall back to light.
			}
		</script>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="frogQuiz" />
		<meta name="application-name" content="frogQuiz" />
		<meta name="msapplication-TileColor" content="#fafafa" />
		<!-- Two theme-colors so the browser chrome follows the app's own theme instead of
		     staying white behind a dark page. #00a300 was upstream's green. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
