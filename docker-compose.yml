# Docker keeps every container's json log forever by default, on a 47 GB boot disk with
# nothing rotating it (#22). 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    restart: always
    logging: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - api
    environment:
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      API_URL: http://api:80
  api:
    # Uses the published image when it exists, builds from source otherwise.
    image: ghcr.io/ogfrench/frogquiz-backend:master
    build:
      context: .
      dockerfile: Dockerfile
    restart: &restart always
    logging: *logging
    # Started once the database and Redis answer their own healthchecks, not merely once
    # their containers exist (#60). docker-compose.neon.yml replaces this list.
    depends_on: &depends
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image has no curl, but it has Python. /api/v1/health answers 503 when the
    # database or Redis is down, which urlopen raises on. `docker compose ps` shows it.
    # The endpoint reuses a passing database check for an hour, so this does not keep
    # Neon's compute awake.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/v1/health', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

    environment: &env_vars # --- DON'T CHANGE FROM HERE ---
      DB_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/frogquiz" # DON'T CHANGE
      REDIS: "redis://redis:6379/0?decode_responses=True" # DON'T CHANGE
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env, e.g. openssl rand -hex 32}
      MAX_WORKERS: "1" # Very important and DON'T CHANGE
      ACCESS_TOKEN_EXPIRE_MINUTES: 30 # DON'T CHANGE
      MEILISEARCH_URL: "http://meilisearch:7700" # DON'T CHANGE
      # -- DON'T CHANGE TILL HERE ---

      # --- GENERAL CONFIG ---
      ROOT_ADDRESS: ${ROOT_ADDRESS:?public URL without a trailing "/"}
      # JSON list of origins allowed to call the API cross-site, e.g. ["https://frogquiz.netlify.app"].
      # Only needed when the frontend is hosted elsewhere (e.g. Netlify) -- see DEPLOY.md.
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      # Proxies in front of the app, counting outwards. 1 is the bundled Caddy; set
      # 2 when Netlify or a CDN proxies to it, or every visitor shares one
      # rate-limit bucket. See DEPLOY.md for what raising it costs.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Anonymous quiz creation, uploads and hosting are on by default (D40); limits apply.
      ANONYMOUS_QUIZZES_ENABLED: ${ANONYMOUS_QUIZZES_ENABLED:-true}
      ANON_QUIZ_DAILY_LIMIT: ${ANON_QUIZ_DAILY_LIMIT:-20}
      ANON_QUIZ_TOTAL_LIMIT: ${ANON_QUIZ_TOTAL_LIMIT:-1000}

      # --- MAIL CONFIG ---
      # Required: signing in is by an emailed link or code only (passwords are off), so
      # without a relay nobody can sign in on a new device. See DEPLOY.md.
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      # starttls (587, the usual), ssl (465), or none (local relay only).
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      # Has to be an address the relay will send for, or it rejects the message.
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-frogQuiz}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Was hardcoded to "True", so no deployment ever asked for a confirmation
      # and every account was verified on creation regardless of .env.
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-False}
      # Who can sign in (an emailed link or code, no passwords, since 5 Oct): the part after
      # the @, matched exactly, comma-separated. Mail above is required for anybody to sign in.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-frog.co,capgemini.com}

      # --- EXTERNAL API CONFIG ---
      # HCAPTCHA_KEY: ""
      # PIXABAY_API_KEY: "" # Get it from here: https://pixabay.com/api/docs/
      # RECAPTCHA_KEY: "" Get it from Google for the Captcha.

      # -- STORAGE CONFIG ---
      STORAGE_BACKEND: "local" # Could also be s3
      STORAGE_PATH: "/app/data" # When s3 is used, this isn't needed.
      # If STORAGE_BACKEND is "s3"
      #S3_ACCESS_KEY: "YOUR_ACCESS_KEY"
      #S3_SECRET_KEY: "YOUR_SECRET_KEY"
      #S3_BASE_URL: "YOUR_S3_BASE_URL"

      # --- GOOGLE_AUTH ---
      # Intentionally left unset for this internal deployment (see CLAUDE.md) -- revisit before enabling.
      #GOOGLE_CLIENT_ID: "" # Your Google-Client ID, or leave it unset if you don't want it.
      #GOOGLE_CLIENT_SECRET: "" # Your Google-Client Secret, or leave it unset if you don't want it.

      # --- GITHUB_AUTH ---
      # Intentionally left unset for this internal deployment (see CLAUDE.md) -- revisit before enabling.
      #GITHUB_CLIENT_ID: "" # Your GitHub-Client ID, or leave it unset if you don't want it.
      #GITHUB_CLIENT_SECRET: "" # Your GitHub-Client Secret, or leave it unset if you don't want it.

      # --- Custom OpenID ---
      # Intentionally left unset for this internal deployment (see CLAUDE.md) -- revisit before enabling.
      #CUSTOM_OPENID_PROVIDER__CLIENT_ID: "" # Adjust if needed
      #CUSTOM_OPENID_PROVIDER__CLIENT_SECRET: "" # Adjust if needed
      #CUSTOM_OPENID_PROVIDER__SERVER_METADATA_URL: "/.well-known/openid-configuration" # Adjust if needed

    volumes: # Only needed if you chose the "local" storage-backend
      - ./uploads:/app/data

  redis:
    image: valkey/valkey:alpine
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  db:
    image: postgres:14-alpine
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: "frogquiz"
    volumes:
      - data:/var/lib/postgresql/data
  proxy:
    image: ghcr.io/ogfrench/frogquiz-caddy:master
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: always
    logging: *logging
    environment:
      # A bare domain (quiz.example.com) makes Caddy fetch a Let's Encrypt cert.
      # Keep the default :80 for local runs (http://localhost).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
  meilisearch:
    # v1 cannot open v0.28's files, so it gets a new volume and starts empty; the API's
    # start-up sync rebuilds the index from Postgres. v1 keeps its data in /meili_data.
    # Moving back is the old tag and the old volume, which is left alone. See DEPLOY.md.
    image: getmeili/meilisearch:v1.54.3
    restart: always
    logging: *logging
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data-v1:/meili_data
  worker:
    image: ghcr.io/ogfrench/frogquiz-backend:master
    build:
      context: .
      dockerfile: Dockerfile
    environment: *env_vars
    depends_on: *depends
    restart: *restart
    logging: *logging
    command: arq frogquiz.worker.WorkerSettings
    # Healthy while its heartbeat (frogquiz/worker/health.py, once a minute) is under three
    # minutes old. The key is WORKER_HEARTBEAT_KEY in frogquiz/config.py.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time, redis; beat = redis.Redis.from_url(os.environ['REDIS']).get('worker:heartbeat'); sys.exit(0 if beat and time.time() - float(beat) < 180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    # The same upload folder as the api. Without it the worker read and deleted an empty
    # folder of its own: no upload was ever hashed or counted, and freed images stayed on
    # disk. tests/test_compose.py keeps the two in step.
    volumes:
      - ./uploads:/app/data

volumes:
  data:
  meilisearch-data-v1:
  caddy-data:
  caddy-config:
