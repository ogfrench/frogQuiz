# Note: this file used to define a `minio` service for S3-style storage. MinIO
# stopped publishing container images to Docker Hub and Quay.io and archived the
# community repository, so `docker.io/minio/minio` now fails to pull - which
# aborted `compose up` and took the database down with it. Nothing here needs it:
# the test env runs STORAGE_BACKEND=local, and test_minio talks to play.min.io
# rather than a local container.
services:
  db:
    #    build:
    #      context: pg_uuidv7
    #      args:
    #        PG_MAJOR_VERSION: 16
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: frogquiz
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frogquiz"]
      interval: 2s
      timeout: 3s
      retries: 30
  meilisearch:
    # The version docker-compose.yml runs in production, so CI tests what ships. A new
    # volume, because this version cannot open the old one's files; the API rebuilds the
    # index from Postgres on start.
    image: getmeili/meilisearch:v1.54.3
    volumes:
      - search-v1-54:/meili_data
    ports:
      - 7700:7700
    environment:
      MEILI_NO_ANALYTICS: "true"
    restart: unless-stopped
  caddy:
    image: caddy:alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    network_mode: "host"
    privileged: true
    restart: unless-stopped
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    ports:
      - 6379:6379
volumes:
  db:
  search-v1-54:
