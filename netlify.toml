# Netlify hosts the SvelteKit frontend only. The backend (FastAPI + socket.io),
# Postgres, Redis, Meilisearch and the arq worker need a container host -- see DEPLOY.md.

[build]
base = "frontend"
command = "pnpm run build"
publish = "build"

[build.environment]
NODE_VERSION = "24"
# Public backend origin. Baked into the client bundle for socket.io (which cannot
# go through Netlify's proxy) and used by the SSR code as its API base URL.
# Not a secret -- it is visible in the shipped JavaScript either way.
VITE_API_ORIGIN = "https://api.frogquiz.xyz"
API_URL = "https://api.frogquiz.xyz"

# REST traffic is proxied so cookies stay first-party.
# Backend lives on the Oracle VM at api.frogquiz.xyz, an A record in Netlify DNS (D32),
# so a new VM IP is a DNS edit rather than a change here. Caddy still also answers on the
# old sslip.io name until DEPLOY.md's "API hostname" step 4.
[[redirects]]
from = "/api/*"
to = "https://api.frogquiz.xyz/api/:splat"
status = 200
force = true

[[redirects]]
from = "/openapi.json"
to = "https://api.frogquiz.xyz/openapi.json"
status = 200
force = true

# NOTE: /socket.io/* is deliberately NOT proxied -- Netlify does not support
# WebSockets. The browser connects straight to VITE_API_ORIGIN instead, which
# requires CORS_ORIGINS on the backend to list this site's URL.

# Out of search results, for static files. Netlify applies this to files it serves itself
# (the manifest, images, robots.txt) but not to the server-rendered pages, which carry the
# tag in app.html instead; together every response is covered. Link previews ignore both;
# see static/robots.txt for why that file does not disallow the site.
[[headers]]
for = "/*"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow"
