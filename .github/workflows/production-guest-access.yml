name: Production guest access

on:
  pull_request:
    paths:
      - ".github/workflows/production-guest-access.yml"
      - "deploy/enable-guests.sh"
      - "deploy/verify-guest-access.py"
      - "deploy/test_guest_repair.py"
  workflow_dispatch:
    inputs:
      mode:
        description: Check SSH access or repair the production backend
        type: choice
        options: [check, repair]
        default: check
        required: true
      deploy_path:
        description: Absolute directory on the VM containing production .env and docker-compose.yml
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-backend-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check repair syntax and failure handling
        run: |
          bash -n deploy/enable-guests.sh
          python3 -m py_compile deploy/verify-guest-access.py
          python3 deploy/test_guest_repair.py
  maintain:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || inputs.mode == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Connect and run selected mode
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: $name. See docs/github-production-access.md"
              exit 1
            fi
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$MODE" == check || "$MODE" == repair ]] || exit 1
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$key_dir/key" > "$key_dir/key.pub"
          echo 'GitHub SSH public-key fingerprint:'
          ssh-keygen -lf "$key_dir/key.pub"
          echo "SSH_PUBLIC_KEY=$(cat "$key_dir/key.pub")"
          ssh-keygen -F "$SSH_HOST" -f "$key_dir/known_hosts" > /dev/null
          ssh_args=(-i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$key_dir/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          printf -v remote_command 'bash -s -- %q %q' "$DEPLOY_PATH" "$MODE"
          {
            cat <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          test -f .env && test -f docker-compose.yml
          docker compose version
          docker compose ps api worker
          if [[ "$2" == check ]]; then
            docker ps -a --format '{{.Names}} | {{.Status}}'
            docker inspect $(docker ps -aq) --format '{{.Name}} | {{index .Config.Labels "com.docker.compose.project.working_dir"}} | {{index .Config.Labels "com.docker.compose.project.config_files"}}'
            find /home /opt /srv -maxdepth 4 -name .env -type f -print 2>/dev/null || true
            docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); print("Guest setting:", c["services"]["api"].get("environment", {}).get("ANONYMOUS_QUIZZES_ENABLED", "image default"))'
            echo 'SSH and Compose access verified. Nothing changed.'
            exit 0
          fi
          REMOTE
            cat deploy/enable-guests.sh
          } | ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "$remote_command"
      - name: Verify public guest endpoints after repair
        if: inputs.mode == 'repair'
        shell: bash
        run: |
          for attempt in {1..12}; do
            if python3 deploy/verify-guest-access.py; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::Guest access verification failed. Inspect API health and the recorded backup before retrying.'
          exit 1
