# Lints the SvelteKit frontend.

name: "[CI] Frontend / Lint & Test"

# GitHub's path filters do not do brace expansion, so the old
# "frontend/**/*.{ts,js,svelte}" was matched literally and never hit a real file.
# The workflow's entire run history is one manual dispatch and one push that
# touched this file -- not a single frontend change ever triggered it. Match the
# directory instead and let the job decide what is worth linting.
on:
  push:
    branches: [ master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_lint.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_lint.yml"

jobs:
  frontend_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10.24.0
          working-directory: ./frontend

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          pnpm install

      - name: Lint
        working-directory: ./frontend
        run: |
          pnpm run lint-without-format-checking

      - name: Test
        working-directory: ./frontend
        run: |
          pnpm run test
