# .github/workflows/app.yaml
name: PyTest
on:
  push:
    paths:
      - "frogquiz/**"
  pull_request:
    paths:
      - "frogquiz/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install pipenv
        run: pipx install pipenv

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pipenv'
      # "sync" installs Pipfile.lock exactly, like the Docker image does.
      # "install" re-resolves and pulls an ormar that no longer depends on
      # "databases", which frogquiz/db/__init__.py imports directly.
      - run: pipenv sync --dev
      - name: Prepare tests
        run: |
          cp .env.ci .env
          set -o allexport; source .env; set +o allexport
          chmod +x run_tests.sh
      - name: Run tests
        env:
          CONTAINER_BIN: docker
        run: ./run_tests.sh a
