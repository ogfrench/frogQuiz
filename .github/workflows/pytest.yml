# .github/workflows/app.yaml
name: PyTest
on:
  # The suite installs the lock, runs the migrations, and starts its database from
  # docker-compose.dev.yml, so a change to any of them alone is tested too: a Dependabot PR
  # touches only Pipfile.lock.
  push:
    paths:
      - "frogquiz/**"
      - "tests/**"
      - "migrations/**"
      - "Pipfile"
      - "Pipfile.lock"
      - ".env.ci"
      - "run_tests.sh"
      - "alembic.ini"
      - "docker-compose.dev.yml"
      # test_compose.py reads it.
      - "docker-compose.yml"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "frogquiz/**"
      - "tests/**"
      - "migrations/**"
      - "Pipfile"
      - "Pipfile.lock"
      - ".env.ci"
      - "run_tests.sh"
      - "alembic.ini"
      - "docker-compose.dev.yml"
      # test_compose.py reads it.
      - "docker-compose.yml"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install pipenv
        run: pipx install pipenv

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pipenv'
      # "sync" installs Pipfile.lock exactly, like the Docker image does.
      # "install" re-resolves and pulls an ormar that no longer depends on
      # "databases", which frogquiz/db/__init__.py imports directly.
      - run: pipenv sync --dev
      - name: Workbook validation without services
        run: pipenv run pytest -q -c /dev/null tests/test_excel_workbook.py
      - name: Prepare tests
        run: |
          cp .env.ci .env
          set -o allexport; source .env; set +o allexport
          chmod +x run_tests.sh
      - name: Run tests
        env:
          CONTAINER_BIN: docker
        run: ./run_tests.sh a
