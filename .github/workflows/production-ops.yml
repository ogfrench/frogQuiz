# SPDX-License-Identifier: MPL-2.0
#
# Two manual jobs on the production VM (#72), over the same SSH secrets and `production`
# environment as the guest-access and backup workflows. Never runs on a push or a PR.
#   facts   read-only: VM shape and region, disk, memory, uploads, container revisions, and
#           whether the signing key is one ever committed to this repo (yes/no only).
#   cleanup frees disk: removes the unused frontend container, unused images and the build
#           cache. Never volumes. Run it before a deploy, since it removes the rollback image.
#   deploy  moves the api and worker to one backend revision that is on master, with no
#           migration to run, and rolls back if they do not come up healthy.
#   migrate the same, for a revision whose migrations move the database forward. It needs
#           the id of a Backup run that passed on master in the last 3 hours, and once a
#           migration has run it never puts the old image back (DEPLOY.md).
#   agents-on, agents-off
#           AI agents (docs/mcp.md): four .env lines, then the api, worker, proxy and mcp
#           recreated. Turning them on is a joint François and Gonçalo decision.
# The log is public: the scripts print no value from .env, no address and no key.

name: Production ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: facts (read-only), cleanup, deploy, migrate, agents-on or agents-off
        type: choice
        options: [facts, cleanup, deploy, migrate, agents-on, agents-off]
        default: facts
        required: true
      revision:
        description: For deploy and migrate. The full commit on master that the backend image was built from.
        type: string
        required: false
      backup_run:
        description: For migrate only. The id of a Backup run that passed on master in the last 3 hours.
        type: string
        required: false
  pull_request:
    paths:
      - ".github/workflows/production-ops.yml"
      - "deploy/ops-facts.sh"
      - "deploy/deploy-backend.sh"
      - "deploy/ops-cleanup.sh"
      - "deploy/agents.sh"

permissions:
  contents: read
  # To read the Backup run that migrate names.
  actions: read

env:
  DEPLOY_PATH: /opt/frogquiz

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash -n deploy/ops-facts.sh && bash -n deploy/deploy-backend.sh && bash -n deploy/ops-cleanup.sh && bash -n deploy/agents.sh

  run:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # On the job, not the workflow, so a pull request's validate run never displaces a
    # queued deploy. Shared with the guest-access workflow's maintain job.
    concurrency:
      group: production-backend-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the revision is on master
        if: inputs.mode == 'deploy' || inputs.mode == 'migrate'
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::revision must be a full 40-character commit'; exit 1; }
          git merge-base --is-ancestor "$REVISION" origin/master ||
            { echo "::error::$REVISION is not on master"; exit 1; }
      - name: Check a backup passed in the last 3 hours
        if: inputs.mode == 'migrate'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN: ${{ inputs.backup_run }}
        run: |
          [[ "$BACKUP_RUN" =~ ^[0-9]+$ ]] || { echo '::error::backup_run must be the numeric id of a Backup run'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN/artifacts" > artifacts.json
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          run = json.load(open("run.json"))
          artifacts = json.load(open("artifacts.json"))["artifacts"]
          done = datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
          problems = []
          if not str(run.get("path", "")).startswith(".github/workflows/backup.yml"):
              problems.append("it is not a Backup run")
          if run.get("head_branch") != "master" or run.get("event") not in ("schedule", "workflow_dispatch"):
              problems.append("it was not a scheduled or manual run on master")
          if run.get("head_repository", {}).get("full_name") != run.get("repository", {}).get("full_name"):
              problems.append("it ran from another repository")
          if run.get("conclusion") != "success":
              problems.append(f"it did not pass ({run.get('conclusion')})")
          if datetime.now(timezone.utc) - done > timedelta(hours=3):
              problems.append(f"it finished at {done:%Y-%m-%d %H:%M} UTC, over 3 hours ago")
          if not any(a["name"].startswith("frogquiz-backup-") and not a["expired"] for a in artifacts):
              problems.append("it has no frogquiz-backup artifact")
          if problems:
              sys.exit("::error::Backup run refused: " + "; ".join(problems))
          print(f"Backup run {run['id']} passed at {done:%Y-%m-%d %H:%M} UTC.")
          PY
      - name: Run on the VM
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          MODE: ${{ inputs.mode }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "::error::Missing secret: $name. See docs/github-production-access.md"; exit 1; }
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || exit 1
          [[ "$MODE" =~ ^(facts|cleanup|deploy|migrate|agents-on|agents-off)$ ]] || exit 1
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh_args=(-i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$key_dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          if [[ "$MODE" == facts ]]; then
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_PATH" < deploy/ops-facts.sh | tee "$GITHUB_STEP_SUMMARY"
          elif [[ "$MODE" == cleanup ]]; then
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_PATH" < deploy/ops-cleanup.sh | tee "$GITHUB_STEP_SUMMARY"
          elif [[ "$MODE" == deploy ]]; then
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_PATH $REVISION" < deploy/deploy-backend.sh
          elif [[ "$MODE" == migrate ]]; then
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_PATH $REVISION migrate" < deploy/deploy-backend.sh
          else
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_PATH ${MODE#agents-}" < deploy/agents.sh
          fi
      - name: Check health after a deploy
        if: inputs.mode != 'facts' && inputs.mode != 'cleanup'
        run: |
          for attempt in {1..12}; do
            body=$(curl -sS -m 15 https://api.frogquiz.xyz/api/v1/health || true)
            if python3 -c 'import json,sys; sys.exit(json.loads(sys.argv[1]).get("status") != "ok")' "$body" 2>/dev/null; then
              echo "Healthy: $body"; exit 0
            fi
            sleep 10
          done
          echo "::error::API health is not ok after the deploy: ${body:-no answer}"
          exit 1
      - name: Check agents answer
        if: inputs.mode == 'agents-on' || inputs.mode == 'agents-off'
        env:
          WANT: ${{ inputs.mode == 'agents-on' && 'true' || 'false' }}
        run: |
          config=$(curl -sS -m 15 https://api.frogquiz.xyz/api/v1/utils/config)
          python3 - "$config" "$WANT" <<'PY'
          import json, sys
          got = json.loads(sys.argv[1]).get("agent_api_enabled")
          want = sys.argv[2] == "true"
          if got is not want:
              sys.exit(f"::error::agent_api_enabled is {got}, expected {want}")
          PY
          if [[ "$WANT" == true ]]; then
            code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' -X POST https://api.frogquiz.xyz/mcp)
            [[ "$code" == 401 ]] || { echo "::error::POST /mcp without a key answered $code, expected 401"; exit 1; }
            echo 'Agents are on: the config says so, and /mcp asks for a key.'
          else
            echo 'Agents are off.'
          fi
